name: demo_dbt_project
version: '1.0'
config-version: 2
profile: demo_dbt_profile
model-paths: ["dbt_project/models"]
seed-paths: ["dbt_project/seeds"]
macro-paths: ["dbt_project/macros"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  demo_dbt_project:
    +materialized: view
    staging:
      +materialized: view
      +schema: staging
      +tags: ['staging', 'silver']
    marts:
      +materialized: table
      +schema: marts
      +tags: ['marts', 'gold']

on-run-start:
  - "{{ log('Starting dbt run', info=true) }}"

on-run-end:
  - "{{ log('dbt run completed', info=true) }}"

require-dbt-version: [">=1.0.0"]

seeds:
  demo_dbt_project:
    +schema: seed
    +enabled: true
