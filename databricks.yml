bundle:
  name: banking-demo-project
  description: End-to-end Databricks project for banking data pipeline
  version: 1.0.0

variables:
  databricks_host: ""
  databricks_token: ""
  environment: dev
  notebook_path: /Shared/banking-demo
  data_path: /Volumes/main/default/banking_data
  node_type: i3.xlarge
  num_workers: 2

targets:
  dev:
    workspace:
      host: ${var.databricks_host}
      token: ${var.databricks_token}
    profile: BANKING_DEMO

resources:
  jobs:
    banking_bronze_job:
      name: Banking_Bronze_Ingestion
      description: Ingest raw data into bronze layer
      tasks:
        - task_key: bronze_layer
          notebook_task:
            notebook_path: ${var.notebook_path}/01_bronze_notebook
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: ${var.node_type}
            num_workers: ${var.num_workers}
          timeout_seconds: 3600
          max_retries: 2

    banking_silver_job:
      name: Banking_Silver_Transformation
      description: Transform bronze data into silver layer
      tasks:
        - task_key: silver_layer
          notebook_task:
            notebook_path: ${var.notebook_path}/02_silver_notebook
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: ${var.node_type}
            num_workers: ${var.num_workers}
          timeout_seconds: 3600
          max_retries: 1

    banking_gold_job:
      name: Banking_Gold_Aggregation
      description: Create analytics-ready gold tables
      tasks:
        - task_key: gold_layer
          notebook_task:
            notebook_path: ${var.notebook_path}/03_gold_notebook
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: ${var.node_type}
            num_workers: ${var.num_workers}
          timeout_seconds: 3600
          max_retries: 1

  notebooks:
    bronze_notebook:
      path: ${var.notebook_path}/01_bronze_notebook
      source: ../notebooks/01_bronze_notebook.py

    silver_notebook:
      path: ${var.notebook_path}/02_silver_notebook
      source: ../notebooks/02_silver_notebook.py

    gold_notebook:
      path: ${var.notebook_path}/03_gold_notebook
      source: ../notebooks/03_gold_notebook.py
