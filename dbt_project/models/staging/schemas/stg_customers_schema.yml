version: 2

models:
  - name: stg_customers
    description: "Staged customers data from silver layer with SCD Type 2 tracking"
    columns:
      - name: customer_id
        description: "Unique identifier for the customer"
        tests:
          - unique
          - not_null
      - name: customer_name
        description: "Full name of the customer"
        tests:
          - not_null
      - name: customer_email
        description: "Email address of the customer"
        tests:
          - not_null
      - name: updated_at
        description: "Timestamp when the customer record was last updated"
        tests:
          - not_null
      - name: is_current
        description: "Flag indicating if this is the current record (SCD Type 2)"
        tests:
          - not_null
      - name: start_date
        description: "Start date for this version of the record (SCD Type 2)"
        tests:
          - not_null
      - name: end_date
        description: "End date for historical records (null for current records)"
